name: Build Flutter APK - Assignment3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.22.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Create Flutter project scaffold
        run: |
          flutter create --org com.example --project-name assignment3 assignment3
          echo "Scaffold done"

      - name: Overwrite Dart sources and pubspec
        run: |
          python3 -c "
          import base64
          exec(base64.b64decode('').decode())
          "

      - name: Verify files
        run: find assignment3/lib -type f && cat assignment3/pubspec.yaml

      - name: flutter pub get
        working-directory: assignment3
        run: flutter pub get

      - name: flutter analyze
        working-directory: assignment3
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Debug APK
        working-directory: assignment3
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: assignment3-debug-apk
          path: assignment3/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Create project ZIP
        run: |
          zip -r assignment3-project.zip assignment3/ \
            --exclude "assignment3/build/*" \
            --exclude "assignment3/.dart_tool/*" \
            --exclude "assignment3/.flutter-plugins*"

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: assignment3-flutter-project-zip
          path: assignment3-project.zip
          retention-days: 30

      - name: Summary
        run: |
          APK="assignment3/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "SUCCESS - APK size: $(du -sh $APK | cut -f1)"
          else
            echo "FAILED - APK not found"; exit 1
          fi
